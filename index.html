<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rhythm</title>
  <meta name="description" content="A habit tracker with flexible schedules, skip days that protect your streak, year heatmaps and statistics. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E8A317'/%3E%3Cpath d='M9 22v-7M16 22V9M23 22v-4' stroke='%232B1D00' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">

  <div class="shell">
